<style>

  :root {
    --bg: #ffffea;
    --text: #210000;
    --line: #c9c2a0;
    --btn-bg: #f0f0f0;
    --btn-active: #333333;
    --btn-active-text: #ffffff;
    --fav-empty: #cc9900;
    --fav-hover: #aa4411;
    --fav-on: #aa4411;
    --fav-on-dark: #7d2f08;
    --type-btn-bg: #ffcc33;
    --type-btn-line: #cc9900;
    --type-btn-active: #b04411;
    --hl-bg: #ffe680;
    --hl-text: #210000;
    --link: #b82e00;
  }
  body.dark {
    --bg: #210000;
    --text: #ffffea;
    --line: #5c3828;
    --btn-bg: #222222;
    --btn-active: #eeeeee;
    --btn-active-text: #111111;
    --fav-empty: #cc9900;
    --fav-hover: #ffcc33;
    --fav-on-dark: #ffcc33;
    --hl-bg: #7a1a1a;
    --hl-text: #ffffea;
    --link: #ffcc33;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 14px 16px;
    background: #660000;
  }

  @media (min-width: 620px) {
    header { padding-left: 110px; padding-right: 110px; }
  }

  @media (max-width: 619px) {
    header { padding-left: 8px; padding-right: 8px; }
    header h1 { font-size: 1.9rem; }
  }
  #menuBtn {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
  }

  #kofiSlot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
  }

  .kofi-button {
    display: inline-block;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 16px;
    background-color: #ffcc33;
    border: 1px solid #cc9900;
    color: #111111;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .kofi-button:hover {
    text-decoration: none;
    background-color: #ffdb66;
  }
  .kofi-button .kofiimg {
    vertical-align: middle;
    height: 13px;
    width: 20px;
    margin-right: 6px;
    margin-bottom: 3px;
    border: none;
  }

  @media (max-width: 419px) {
    .kofi-word { display: none; }
    .kofi-button .kofiimg { margin-right: 0; }
    .kofi-button { padding: 6px 9px; }
  }

  .header-btns {
    display: block;
    width: 0;
    height: 0;
  }

  header h1 {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.03em;
    color: #ffffea;
  }

  header h1 a {
    color: #ffffea;
    text-decoration: none;
  }
  header h1 a:hover { text-decoration: none; }
  #map { height: 260px; width: 100%; }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
  }
  .filter-btn {
    border: 1px solid var(--line);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--btn-active);
    color: var(--btn-active-text);
  }

  #typeFilters .filter-btn {
    background: var(--type-btn-bg);
    border-color: var(--type-btn-line);
    color: #111111;
  }
  #typeFilters .filter-btn.active {
    background: var(--type-btn-active);
    border-color: #963a0c;
    color: #ffffff;
  }
  #typeFilters .filter-btn:hover {
    background: #ffdb66;
  }
  #typeFilters .filter-btn.active:hover {
    background: #963a0c;
  }

  #dateRangeBox {
    display: none;
    gap: 8px;
    padding: 0 16px 10px;
    align-items: center;
  }
  #dateRangeBox input { padding: 4px; }

  #eventList {
    padding: 0 16px 20px;
  }

  #submitPrompt {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    text-align: center;
    margin: 0;
    padding: 0 16px 40px;
  }
  #submitPrompt a { color: var(--text); text-decoration: underline; }
  #submitPrompt a:hover { text-decoration: none; }

  .event {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 8px;
    align-items: center;
  }
  .event:last-child { border-bottom: none; }
  #modalContent {
    display: grid;
    grid-template-columns: 1fr auto;
    column-gap: 8px;
    align-items: center;

    padding-right: 34px;
  }

  .event > .event-title,
  .event > .event-line,
  .event > .more-info-btn,
  #modalContent > .event-title,
  #modalContent > .event-line,
  #modalContent > .ticket-link {
    grid-column: 1;
  }
  .event > .fav-btn,
  #modalContent > .fav-btn {
    grid-column: 2;
    grid-row: 1;
    justify-self: center;
  }
  .event > .send-btn,
  #modalContent > .send-btn {
    grid-column: 2;
    grid-row: 2;
    justify-self: center;
  }

  .event > .more-info-btn,
  #modalContent > .ticket-link {
    justify-self: start;
  }

  .event-open {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    color: inherit;
    cursor: pointer;
  }

  .event-open:hover { text-decoration: none; }

  .event-open:focus-visible,
  .fav-btn:focus-visible,
  .send-btn:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }
  .event-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 6px; }
  .event-line { margin-bottom: 4px; font-size: 0.92rem; opacity: 0.9; }
  .event-line a { color: inherit; }

  #status { padding: 20px 16px; opacity: 0.7; }

  .venue-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
  .venue-address { font-size: 0.8rem; font-style: italic; opacity: 0.75; margin-bottom: 14px; }
  .venue-events { max-height: 180px; overflow-y: auto; }
  .venue-event-line {
    display: flex;

    gap: 0.3em;
    margin-bottom: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .venue-event-datetime {
    flex-shrink: 0;
    color: #000000;
  }
  .venue-event-link {
    color: #b82e00;
    text-decoration: none;
  }
  .venue-event-link:hover {
    text-decoration: underline;
  }
  .event { transition: background 0.4s, box-shadow 0.4s; }
  .event.highlight {
    background: var(--hl-bg);
    color: var(--hl-text);
    box-shadow: -16px 0 0 var(--hl-bg), 16px 0 0 var(--hl-bg);
  }

  #map {
    border-bottom: 2px solid #cc9900;
  }

  .leaflet-popup-content-wrapper {
    background: #ffffea;
    color: #000000;
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: #ffffea; }
  .venue-name, .venue-address { color: #000000; }
  .leaflet-container a.leaflet-popup-close-button { color: #000000; }
  .leaflet-container a.leaflet-popup-close-button:hover { color: #666666; }
  #map .venue-event-link { color: #b82e00; }

  .map-pin {
    background: none;
    border: none;
    cursor: pointer;
  }

  /* The pin's venue name. Visually hidden, but read out by a screen reader so
     each pin is announced as the venue it stands for rather than as an
     unnamed button. */
  .pin-name {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  #modalOverlay.open { display: flex; }
  #modalBox {
    position: relative;
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  #modalClose {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }

  #modalContent .event-title { font-size: 1.2rem; }
  #modalContent .event-line { margin-bottom: 8px; }
  #modalContent a.ticket-link {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 16px;
    background: var(--btn-active);
    color: var(--btn-active-text);
    border-radius: 16px;
    text-decoration: none;
  }

  .send-btn {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--fav-empty);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    flex-shrink: 0;
  }
  .send-btn svg { display: block; width: 1.5rem; height: 1.5rem; }
  .send-btn:hover { color: var(--fav-hover); }

  .send-btn.copied { color: #2e7d32; }
  #modalContent .send-btn { width: 2.75rem; height: 2.75rem; }
  #modalContent .send-btn svg { width: 1.65rem; height: 1.65rem; }

  #modalContent a.venue-jump {
    color: var(--link);
    text-decoration: underline;
    cursor: pointer;
  }

  .event-line a.venue-jump-inline {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .event-line a.venue-jump-inline:hover { text-decoration: none; }

  #favFilterRow { align-items: center; }
  #favFilterRow .filter-btn { border-color: #cc9900; color: var(--text); }
  #favFilterRow .filter-btn.active {
    background: var(--type-btn-active);
    color: #ffffff;
    border-color: #963a0c;
  }
  #favFilterRow .filter-btn:disabled { opacity: 0.45; cursor: default; }
  #favCount { font-size: 0.85rem; opacity: 0.7; }

  #toTop {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid #cc9900;
    background: #ffcc33;
    color: #210000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    z-index: 900;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  #toTop.show { opacity: 1; visibility: visible; }
  #toTop:hover { background: #ffd75e; }
  #toTop:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  #toTop svg { display: block; width: 22px; height: 22px; }

  .fav-btn {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--fav-empty);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    flex-shrink: 0;
  }
  .fav-btn.on { color: var(--fav-on); }
  .fav-btn svg { display: block; width: 1.6rem; height: 1.46rem; }
  .fav-btn:hover { color: var(--fav-hover); }
  .fav-btn.on:hover { color: var(--fav-on-dark); }

  #modalContent .fav-btn { width: 2.75rem; height: 2.75rem; }
  #modalContent .fav-btn svg { width: 1.75rem; height: 1.6rem; }

  #menuBtn {
    border: 1px solid #cc9900;
    background: #ffcc33;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    height: 32px;
  }
  #menuBtn:hover { background: #ffdb66; }

  #menuBtn svg { display: block; width: 20px; height: 16px; }
  #menuBtn svg line {
    stroke: #210000;
    stroke-width: 2.2;
    stroke-linecap: round;
  }

  #menuShade {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1100;
  }
  #menuShade.open { display: block; }

  #menuPanel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    max-width: 82vw;
    background: var(--bg);
    color: var(--text);
    border-right: 2px solid #cc9900;
    padding: 16px 20px 24px;
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 1101;
  }
  #menuPanel.open { transform: translateX(0); }

  #menuClose {
    display: block;
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
  }
  #menuClose:hover { color: #b04411; }
  #menuHeading {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 1.4rem;
    margin: 10px 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .menu-link {
    display: block;
    padding: 12px 0;
    color: var(--link);
    text-decoration: none;
    font-size: 1.05rem;
  }

  .menu-link.current {
    text-decoration: underline;
  }
  .menu-link:hover { text-decoration: underline; }
  .menu-link.current:hover { text-decoration: underline; }

  .menu-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 0;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--link);
    font-family: inherit;
    font-size: 1.05rem;
    line-height: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .menu-btn:hover { text-decoration: underline; }
</style>

  gigs: ['Folk Music'],
  sessions: ['Music Session'],
  dance: ['Ceilidh / Social Dance', 'Traditional Dance'],
  crafts: ['Heritage Workshop'],
  markets: ['Market'],
  spokenword: ['Spoken Word'],
  other: ['Other']
};

let allEvents = [];

const DEFAULT_CENTRE = [54.9783, -1.6178];
const DEFAULT_ZOOM = 12;

let mapHasFitted = false;
let activeTypes = new Set();
let activeRange = 'all';
let favouritesOnly = false;
let map, markersLayer;
let venueMarkers = {};

const FAV_KEY = 'newcastleFolkFavourites';
let favIds = new Set();

const MAP_KEY = 'kirnMapView';
let suppressMapSave = false;

let hasSavedMapView = false;

function loadFavourites() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) favIds = new Set(parsed.filter(x => typeof x === 'string'));
  } catch (err) {

    favIds = new Set();
  }
}

function saveFavourites() {
  try {
    localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favIds)));
  } catch (err) {

  }
}

function pruneFavourites() {
  if (!allEvents.length) return;
  const live = new Set(allEvents.map(e => favId(e)));
  const kept = Array.from(favIds).filter(id => live.has(id));
  if (kept.length === favIds.size) return;
  favIds = new Set(kept);
  saveFavourites();
}

function isFavourite(e) {
  return favIds.has(favId(e));
}

const SHARE_PARAM = 'event';

function siteBase() {
  return window.location.origin + window.location.pathname;
}

function shareUrlFor(e) {
  return siteBase() + '?' + SHARE_PARAM + '=' +
    encodeURIComponent(favId(e));
}

function readSharedEventId() {
  try {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get(SHARE_PARAM);
    if (!raw) return '';
    try {
      return decodeURIComponent(raw).toLowerCase().trim();
    } catch (err) {
      return '';
    }
  } catch (err) {
    return '';
  }
}

function openSharedEvent() {
  const wanted = readSharedEventId();
  if (!wanted) return;

  const target = allEvents.find(e => favId(e).toLowerCase().trim() === wanted);
  if (!target) return;

  activeTypes.clear();
  activeRange = 'all';
  favouritesOnly = false;
  document.querySelectorAll('#typeFilters .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#dateFilters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.range === 'all');
  });
  document.getElementById('dateRangeBox').style.display = 'none';
  document.getElementById('favFilter').classList.remove('active');
  render();

  openModal(target);
  const el = document.getElementById(target.domId);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('highlight');
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }

  try {
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.position = 'absolute';
    helper.style.left = '-9999px';
    document.body.appendChild(helper);
    helper.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(helper);
    return ok ? Promise.resolve() : Promise.reject(new Error('copy failed'));
  } catch (err) {
    return Promise.reject(err);
  }
}

function shareEvent(e, button) {
  const url = shareUrlFor(e);
  const label = e.title + ' - The Kirn';

  const done = function() {
    button.classList.add('copied');
    button.title = 'Link copied';
    say('Link copied to the clipboard.');
    setTimeout(function() {
      button.classList.remove('copied');
      button.title = 'Share this event';
    }, 2500);
  };

  if (navigator.share) {
    navigator.share({ title: label, text: 'Folk events in Newcastle', url: url })
      .then(done)['catch'](function() {

        copyToClipboard(url).then(done, function() {});
      });
    return;
  }

  copyToClipboard(url).then(done, function() {
    say('Could not copy automatically - please copy the address bar.');
  });
}

let sayTimer = null;
function say(message) {
  let el = document.getElementById('sayLine');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sayLine';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.style.cssText =
      'position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;';
    document.body.appendChild(el);
  }
  el.textContent = message;
  if (sayTimer) clearTimeout(sayTimer);
  sayTimer = setTimeout(function() { el.textContent = ''; }, 4000);
}

function favId(e) {
  if (e.eventId) return e.eventId;
  const norm = t => String(t || '').toLowerCase()
    .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  return e.date + '|' + norm(e.venue) + '|' + norm(e.title);
}

function toggleFavourite(e) {
  const id = favId(e);
  if (favIds.has(id)) favIds.delete(id);
  else favIds.add(id);
  saveFavourites();
  render();
}

function shareButtonHtml(e) {
  const icon =
    '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<path d="M12 3.6v10.2M8.4 7.2L12 3.6l3.6 3.6" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M6.6 10.6H5.4v8.2a1.6 1.6 0 001.6 1.6h10a1.6 1.6 0 001.6-1.6v-8.2h-1.2" ' +
        'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
        'stroke-linejoin="round"/>' +
    '</svg>';
  return '<button class="send-btn" data-dom-id="' + e.domId + '"' +
    ' aria-pressed="false"' +
    ' aria-label="Share this event"' +
    ' title="Share this event">' + icon + '</button>';
}

function favButtonHtml(e, extraClass) {
  const on = isFavourite(e);
  const label = on ? 'Remove from favourites' : 'Add to favourites';
  const heart = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M12 20.7l-1.3-1.2C6.1 15.3 3.4 12.8 3.4 9.6 3.4 7 5.3 5 7.9 5c1.5 0 2.9.7 3.8 1.8l.3.4.3-.4C13.2 5.7 14.6 5 16.1 5c2.6 0 4.5 2 4.5 4.6 0 3.2-2.7 5.7-7.3 9.9L12 20.7z" ' +
    (on ? 'fill="currentColor" stroke="currentColor" stroke-width="1.4"'
        : 'fill="none" stroke="currentColor" stroke-width="1.8"') +
    ' stroke-linejoin="round"/></svg>';
  return '<button class="fav-btn' + (on ? ' on' : '') + (extraClass ? ' ' + extraClass : '') + '"' +
    ' data-dom-id="' + e.domId + '"' +
    ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
    ' aria-label="' + label + '"' +
    ' title="' + label + '">' + heart + '</button>';
}

const PIN_SELECTED_H = 47;

// The text a screen reader announces for a map pin, and the tooltip a mouse
// user gets. Leaflet gives every marker role="button" but no name of its own,
// so without this it reads out as dozens of identical unnamed buttons with no
// way to tell one venue from another.
const PIN_UNNAMED = 'Event location';

function pinLabel(g) {
  const n = g.events.length;
  return (g.venue || PIN_UNNAMED) + ' - ' + n + (n === 1 ? ' event' : ' events');
}

function pinIcon(selected, g) {
  const w = selected ? 29 : 25;
  const h = selected ? 47 : 41;
  const body = selected ? '#7A1A0A' : '#B04411';
  const edge = selected ? '#3A0D02' : '#7A1A0A';
  const html =
    '<span class="pin-name">' + esc(pinLabel(g)) + '</span>' +
    '<svg viewBox="0 0 24 36" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path d="M12 35.2C12 35.2 22 22.6 22 12.4A10 10 0 0 0 2 12.4C2 22.6 12 35.2 12 35.2Z" ' +
        'fill="' + body + '" stroke="' + edge + '" stroke-width="1.6"/>' +
      '<circle cx="12" cy="12.4" r="3.7" fill="#ffffea"/>' +
    '</svg>';
  return L.divIcon({
    html: html,
    className: 'map-pin',
    iconSize: [w, h],
    iconAnchor: [w / 2, h],
    popupAnchor: [0, -h],
    alt: pinLabel(g),
    title: pinLabel(g)
  });
}

function showPinWithPopup(marker) {
  const el = marker.getPopup().getElement();
  const listEl = el && el.querySelector('.venue-events');
  if (!listEl) return;
  const size = map.getSize();
  const chrome = el.offsetHeight - listEl.offsetHeight;
  const roomForList = size.y - PIN_SELECTED_H - chrome - 24;
  listEl.style.maxHeight = Math.max(60, roomForList) + 'px';

  const popupH = el.offsetHeight;
  const tip = map.latLngToContainerPoint(marker.getLatLng());
  const popupTop = tip.y - PIN_SELECTED_H - popupH;
  if (popupTop < 8) map.panBy([0, popupTop - 8]);
}

function initMap() {
  const saved = loadSavedMapView();
  hasSavedMapView = !!saved;
  map = L.map('map').setView(
    saved ? [saved.lat, saved.lng] : DEFAULT_CENTRE,
    saved ? saved.zoom : DEFAULT_ZOOM
  );
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);

  map.on('moveend zoomend', saveMapView);
}

function loadSavedMapView() {
  try {
    const raw = localStorage.getItem(MAP_KEY);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (typeof v !== 'object' || v === null) return null;
    const lat = Number(v.lat), lng = Number(v.lng), zoom = Number(v.zoom);
    if (!isFinite(lat) || !isFinite(lng) || !isFinite(zoom)) return null;
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    if (zoom < 1 || zoom > 18) return null;
    return { lat: lat, lng: lng, zoom: zoom };
  } catch (err) {

    return null;
  }
}

function saveMapView() {

  if (suppressMapSave) return;
  try {
    const c = map.getCenter();
    localStorage.setItem(MAP_KEY, JSON.stringify({
      lat: Math.round(c.lat * 100000) / 100000,
      lng: Math.round(c.lng * 100000) / 100000,
      zoom: map.getZoom()
    }));
  } catch (err) {

  }
}

function fitMapToPins() {
  if (!map || !map.fitBounds) return false;
  const pts = [];
  markersLayer.eachLayer(m => {
    const p = m.getLatLng();
    if (p) pts.push([p.lat, p.lng]);
  });

  if (pts.length < 2) return false;

  if (map.invalidateSize) map.invalidateSize();

  map.fitBounds(pts, { padding: [30, 30], maxZoom: DEFAULT_ZOOM, animate: false });
  return true;
}

function autoFitMapToPins() {
  suppressMapSave = true;
  try {
    return fitMapToPins();
  } finally {
    suppressMapSave = false;
  }
}

function loadEvents() {
  Papa.parse(CONFIG.CSV_URL, {
    download: true,
    header: true,
    complete: function(results) {
      allEvents = results.data
        .filter(row => row.Title && row.Date)
        .map((row, idx) => ({
          eventId: row.EventID || '',
          domId: 'event-' + idx + '-' + (row.EventID || row.Title).replace(/[^a-zA-Z0-9]/g, '').slice(0, 40),
          title: row.Title,
          description: row.Description,
          category: row.Category || '',
          date: row.Date,
          startTime: row.StartTime || '',
          endTime: row.EndTime || '',
          venue: row.Venue || '',
          address: row.Address || '',
          lat: parseFloat(row.Lat),
          lng: parseFloat(row.Lng),
          sourceUrl: row.SourceURL || ''
        }));
      document.getElementById('status').style.display = 'none';
      pruneFavourites();
      render();

      openSharedEvent();
    },
    error: function() {
      document.getElementById('status').textContent =
        'Events failed to load. Please try again later.';
    }
  });
}

function todayStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));

  const m = ('0' + (d.getMonth() + 1)).slice(-2);
  const day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}

function startOfWeek(date) {
  const day = date.getDay();
  const daysSinceMonday = (day === 0) ? 6 : day - 1;
  const monday = new Date(date);
  monday.setDate(date.getDate() - daysSinceMonday);
  return monday;
}

function passesDateFilter(dateStr) {
  if (activeRange === 'all') return true;
  const today = new Date(todayStr());
  const eventDate = new Date(dateStr);

  if (activeRange === 'today') return dateStr === todayStr();

  if (activeRange === 'week') {
    const monday = startOfWeek(today);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return eventDate >= monday && eventDate <= sunday;
  }
  if (activeRange === 'weekend') {

    const monday = startOfWeek(today);
    const sat = new Date(monday); sat.setDate(monday.getDate() + 5);
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    return eventDate >= sat && eventDate <= sun;
  }
  if (activeRange === 'month') {
    return eventDate.getMonth() === today.getMonth() &&
      eventDate.getFullYear() === today.getFullYear();
  }
  if (activeRange === 'custom') {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    if (!from || !to) return true;
    return dateStr >= from && dateStr <= to;
  }
  return true;
}

function passesTypeFilter(category) {
  if (activeTypes.size === 0) return true;
  for (const type of activeTypes) {
    if ((TYPE_GROUPS[type] || []).includes(category)) return true;
  }
  return false;
}

function venueKeyFor(e) {
  const venueNorm = (e.venue || '')
    .toLowerCase()
    .replace(/^the\s+/, '')
    .replace(/\s+the\s+/g, ' ')
    .replace(/[^a-z0-9]/g, '')
    .trim();

  const postcodeMatch = (e.address || '').match(/([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})/i);
  const postcode = postcodeMatch ? postcodeMatch[1].replace(/\s+/g, '') : '';

  return (venueNorm || postcode) ? venueNorm + '|' + postcode : e.lat + ',' + e.lng;
}

function render() {

  updateFavCount();

  const filtered = allEvents
    .filter(e => passesTypeFilter(e.category) && passesDateFilter(e.date))
    .filter(e => !favouritesOnly || isFavourite(e))
    .sort((a, b) => a.date.localeCompare(b.date));

  markersLayer.clearLayers();
  venueMarkers = {};

  const venueGroups = {};
  filtered.forEach(e => {
    if (!e.lat || !e.lng) return;
    const venueKey = venueKeyFor(e);
    if (!venueGroups[venueKey]) {
      venueGroups[venueKey] = { venue: e.venue, address: e.address, lat: e.lat, lng: e.lng, events: [] };
    }
    if (!venueGroups[venueKey].address && e.address) venueGroups[venueKey].address = e.address;
    venueGroups[venueKey].events.push(e);
  });
  Object.keys(venueGroups).forEach(key => {
    const g = venueGroups[key];
    const marker = L.marker([g.lat, g.lng], { icon: pinIcon(false, g), alt: pinLabel(g), title: pinLabel(g) }).addTo(markersLayer)
      .bindPopup(buildVenuePopup(g), { maxWidth: 320 });

    marker.on('popupopen', () => {
      marker.setIcon(pinIcon(true, g));
      showPinWithPopup(marker);
    });
    marker.on('popupclose', () => marker.setIcon(pinIcon(false, g)));
    venueMarkers[key] = marker;
  });

  if (!mapHasFitted && !hasSavedMapView) {
    if (autoFitMapToPins()) mapHasFitted = true;
  }

  const list = document.getElementById('eventList');
  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div id="status">No events match these filters.</div>';
    return;
  }

  filtered.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'event';
    div.id = e.domId;

    const key = venueKeyFor(e);
    const venueHtml = (e.venue && venueMarkers[key])
      ? '<a href="#" class="venue-jump-inline" data-venue-key="' + esc(key) + '">' +
          esc(e.venue) + '</a>'
      : esc(e.venue);
    div.innerHTML =
      '<button type="button" class="event-title event-open">' + esc(e.title) + '</button>' +
      favButtonHtml(e) +
      '<button type="button" class="event-line event-open">' +
        esc(formatDateDisplay(e.date)) +
        (e.startTime ? ', ' + esc(formatTimeDisplay(e.startTime)) : '') + '</button>' +
      shareButtonHtml(e) +
      '<div class="event-line">' + venueHtml + '</div>' +
      (e.category ? '<div class="event-line">' + esc(e.category) + '</div>' : '') +
      '<button class="filter-btn more-info-btn" data-index="' + i + '">More info</button>';
    list.appendChild(div);
  });

  window.currentFilteredEvents = filtered;
}

function updateFavCount() {
  const countEl = document.getElementById('favCount');
  const btn = document.getElementById('favFilter');
  const n = favIds.size;
  if (n === 0) {
    countEl.textContent = '';
  } else {
    countEl.textContent = n + (n === 1 ? ' favourite' : ' favourites');
  }

  btn.disabled = (n === 0);
  if (n === 0) {
    favouritesOnly = false;
    btn.classList.remove('active');
  }
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function isSafeUrl(url) {
  return /^https?:\/\//i.test(String(url || '').trim());
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'short' });
  const month = d.toLocaleDateString('en-GB', { month: 'short' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

function buildVenuePopup(g) {
  let html = '<div class="venue-popup"><div class="venue-name">' +
    esc(g.venue || 'Event location') + '</div>';
  if (g.address) html += '<div class="venue-address">' + esc(g.address) + '</div>';
  html += '<div class="venue-events">';
  g.events.forEach(e => {
    const time = e.startTime ? ' - ' + formatTimeDisplay(e.startTime) : '';
    const datetime = formatDateShort(e.date) + time + ' - ';
    html += '<div class="venue-event-line">' +
      '<span class="venue-event-datetime">' + esc(datetime) + '</span>' +
      '<a href="#" class="venue-event-link" onclick="scrollToEvent(\'' +
      e.domId + '\'); return false;">' + esc(e.title) + '</a>' +
      '</div>';
  });
  return html + '</div></div>';
}

function scrollToEvent(domId) {
  const el = document.getElementById(domId);
  if (!el) return;
  map.closePopup();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 2000);
}

function jumpToVenue(venueKey) {
  const marker = venueMarkers[venueKey];
  if (!marker) return;
  closeModal();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (!map.getBounds().contains(marker.getLatLng())) {
    map.setView(marker.getLatLng(), map.getZoom());
  }
  marker.openPopup();
}

function isGenericListingLink(url) {
  if (!url) return true;
  return url.indexOf('thecrackmagazine.com/whatson') !== -1;
}

let modalEvent = null;

function openModal(e) {
  modalEvent = e;
  paintModal();
  document.getElementById('modalOverlay').classList.add('open');
}

function paintModal() {
  const e = modalEvent;
  if (!e) return;
  const content = document.getElementById('modalContent');

  const venueKey = venueKeyFor(e);
  const venueHtml = venueMarkers[venueKey]
    ? '<a href="#" class="venue-jump" onclick="jumpToVenue(\'' + venueKey + '\'); return false;">' +
        esc(e.venue || 'Event location') + '</a>'
    : esc(e.venue);
  content.innerHTML =
    '<div class="event-title">' + esc(e.title) + '</div>' +
    favButtonHtml(e, 'modal-fav-btn') +
    '<div class="event-line">' + esc(formatDateDisplay(e.date)) +
      (e.startTime ? ', ' + esc(formatTimeDisplay(e.startTime)) : '') + '</div>' +
    shareButtonHtml(e) +
    '<div class="event-line">' + venueHtml + '</div>' +
    (e.description ? '<div class="event-line">' + esc(e.description) + '</div>' : '') +
    (!isGenericListingLink(e.sourceUrl) && isSafeUrl(e.sourceUrl)
      ? '<a class="ticket-link" href="' + esc(e.sourceUrl) + '" target="_blank" rel="noopener noreferrer">More info</a>'
      : '');
  const btn = content.querySelector('.fav-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      const target = allEvents.find(x => x.domId === btn.dataset.domId);
      if (!target) return;
      toggleFavourite(target);

      if (document.getElementById('modalOverlay').classList.contains('open')) {
        paintModal();
      }
    });
  }

  const shareBtn = content.querySelector('.send-btn');
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      const target = allEvents.find(x => x.domId === shareBtn.dataset.domId);
      if (target) shareEvent(target, shareBtn);
    });
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalEvent = null;
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (event) => {
  if (event.target.id === 'modalOverlay') closeModal();
});

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function formatDateDisplay(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;

  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'long' });
  const month = d.toLocaleDateString('en-GB', { month: 'long' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

function formatTimeDisplay(timeStr) {
  if (!timeStr) return '';
  const match = timeStr.match(/(\d{1,2}):(\d{2})/);
  if (!match) return timeStr;
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const suffix = hour >= 12 ? 'pm' : 'am';
  hour = hour % 12;
  if (hour === 0) hour = 12;
  return hour + (minute === '00' ? '' : ':' + minute) + suffix;
}

function countPageView() {
  if (!CONFIG.WEB_APP_URL) return;
  try {
    fetch(CONFIG.WEB_APP_URL + '?hit=1', {
      mode: 'no-cors',

      referrerPolicy: 'no-referrer',

      keepalive: true,
      cache: 'no-store'
    })['catch'](function() {});
  } catch (err) {

  }
}

function updateThemeLabel() {
  document.getElementById('darkToggle').textContent =
    document.body.classList.contains('dark') ? 'Light mode' : 'Dark mode';
}

document.getElementById('darkToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  try {
    localStorage.setItem('kirnTheme', document.body.classList.contains('dark') ? 'dark' : 'light');
  } catch (err) {}
  updateThemeLabel();
});

updateThemeLabel();

const menuPanel = document.getElementById('menuPanel');
const menuBtn = document.getElementById('menuBtn');
const menuShade = document.getElementById('menuShade');

function setMenuOpen(open) {
  menuPanel.classList.toggle('open', open);
  menuShade.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) menuPanel.scrollTop = 0;
}

menuBtn.addEventListener('click', () => setMenuOpen(!menuPanel.classList.contains('open')));
document.getElementById('menuClose').addEventListener('click', () => setMenuOpen(false));
menuShade.addEventListener('click', () => setMenuOpen(false));
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && menuPanel.classList.contains('open')) setMenuOpen(false);
});

document.getElementById('eventList').addEventListener('click', ev => {
  const favBtn = ev.target.closest('.fav-btn');
  if (favBtn) {
    const e = allEvents.find(x => x.domId === favBtn.dataset.domId);
    if (e) toggleFavourite(e);
    return;
  }
  const venueLink = ev.target.closest('.venue-jump-inline');
  if (venueLink) {
    ev.preventDefault();
    jumpToVenue(venueLink.dataset.venueKey);
    return;
  }
  const shareBtn = ev.target.closest('.send-btn');
  if (shareBtn) {

    const e = allEvents.find(x => x.domId === shareBtn.dataset.domId);
    if (e) shareEvent(e, shareBtn);
    return;
  }
  const moreBtn = ev.target.closest('.more-info-btn');
  if (moreBtn) {
    const e = window.currentFilteredEvents[parseInt(moreBtn.dataset.index, 10)];
    if (e) openModal(e);
    return;
  }

  const openBtn = ev.target.closest('.event-open');
  if (openBtn) {
    const card = openBtn.closest('.event');
    const e = card ? allEvents.find(x => x.domId === card.id) : null;
    if (e) openModal(e);
  }
});

document.querySelectorAll('#typeFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.type;
    if (activeTypes.has(type)) {
      activeTypes.delete(type);
      btn.classList.remove('active');
    } else {
      activeTypes.add(type);
      btn.classList.add('active');
    }
    render();
  });
});

function setDateRange(range) {

  activeRange = (range === activeRange && range !== 'all') ? 'all' : range;
  document.querySelectorAll('#dateFilters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.range === activeRange);
  });
  document.getElementById('dateRangeBox').style.display =
    activeRange === 'custom' ? 'flex' : 'none';
  render();
}

document.querySelectorAll('#dateFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => setDateRange(btn.dataset.range));
});

document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

document.getElementById('favFilter').addEventListener('click', () => {
  if (favIds.size === 0) return;
  favouritesOnly = !favouritesOnly;
  document.getElementById('favFilter').classList.toggle('active', favouritesOnly);
  render();
});

loadFavourites();
initMap();
loadEvents();
countPageView();

const TOP_HIDE_DELAY = 1000;
let topHideTimer = null;

function topButtonPastFilters() {
  const anchor = document.getElementById('favFilterRow');
  if (!anchor) return false;
  return anchor.getBoundingClientRect().bottom < 0;
}

function showTopButton() {
  if (topHideTimer !== null) {
    clearTimeout(topHideTimer);
    topHideTimer = null;
  }
  document.getElementById('toTop').classList.add('show');
}

function scheduleTopButtonHide() {
  if (topHideTimer !== null) clearTimeout(topHideTimer);
  topHideTimer = setTimeout(function () {
    topHideTimer = null;
    document.getElementById('toTop').classList.remove('show');
  }, TOP_HIDE_DELAY);
}

function updateTopButton() {
  if (topButtonPastFilters()) showTopButton();
  else scheduleTopButtonHide();
}

document.getElementById('toTop').addEventListener('click', function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('scroll', updateTopButton, { passive: true });
window.addEventListener('resize', updateTopButton);
updateTopButton();
</script>
</body>
