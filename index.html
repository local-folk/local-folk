<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kirn</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* ============================================================
     PASTE YOUR PUBLISHED SHEET CSV LINK BELOW (see CONFIG in the
     <script> section near the bottom of this file)
     ============================================================ */

  /* Palette taken from thesession.org: pale page #ffffea with dark
     red ink #210000, bright yellow #ffcc33, gold #cc9900, rust
     button #b04411 and orange link #b82e00. */
  :root {
    --bg: #ffffea;
    --text: #210000;
    --line: #c9c2a0;
    --btn-bg: #f0f0f0;
    --btn-active: #333333;
    --btn-active-text: #ffffff;
    --fav-empty: #8f8250;
    --fav-hover: #aa4411;
    --fav-on: #aa4411;
    --fav-on-dark: #7d2f08;
    --type-btn-bg: #ffcc33;
    --type-btn-line: #cc9900;
    --type-btn-active: #b04411;
    --hl-bg: #ffe680;
    --hl-text: #210000;
    --link: #b82e00;
  }
  body.dark {
    --bg: #210000;
    --text: #ffffea;
    --line: #5c3828;
    --btn-bg: #222222;
    --btn-active: #eeeeee;
    --btn-active-text: #111111;
    --fav-empty: #6f6440;
    --fav-hover: #ffcc33;
    --fav-on-dark: #ffcc33;
    --hl-bg: #7a1a1a;
    --hl-text: #ffffea;
    --link: #ffcc33;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* The title bar keeps the same dark red in both themes, so its
     contents are set explicitly rather than inheriting the theme. */
  header {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 14px 16px;
    background: #660000;
  }
  /* The menu button sits at the left and the Ko-fi button at the right. On
     a wide screen each is pinned to its own side and the bar is padded
     either side, so the title stays dead centre without sliding underneath
     them. On a narrow screen there isn't room for that, so both drop below
     the title instead, where the long heading has room to be as big as it
     likes. */
  @media (min-width: 620px) {
    header { padding-left: 110px; padding-right: 110px; }
  }
  /* The header stays a single row at every width - buttons at the ends,
     title in the middle - so on a phone the title just needs to be a size
     that fits between them. */
  @media (max-width: 619px) {
    header { padding-left: 8px; padding-right: 8px; }
    header h1 { font-size: 1.9rem; }
  }
  #menuBtn {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
  }
  /* Ko-fi's own button markup, rebuilt as plain HTML. Their widget uses
     document.writeln, which can blank the page if it runs late, and it
     offers no way to say where the button should go. This version sits
     exactly where the header wants it. The colour, text and account are
     the three values passed to their init(), kept here instead. */
  #kofiSlot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
  }
  /* The same yellow and gold as the event type filter buttons, with a
     rounded pill shape and the same gold outline. */
  .kofi-button {
    display: inline-block;
    white-space: nowrap;
    padding: 6px 14px;
    border-radius: 16px;
    background-color: #ffcc33;
    border: 1px solid #cc9900;
    color: #111111;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .kofi-button:hover {
    text-decoration: none;
    background-color: #ffdb66;
  }
  .kofi-button .kofiimg {
    vertical-align: middle;
    height: 13px;
    width: 20px;
    margin-right: 6px;
    margin-bottom: 3px;
    border: none;
  }
  /* On a narrow phone the word would push the title into it, so the cup
     icon carries the button on its own. */
  @media (max-width: 419px) {
    .kofi-word { display: none; }
    .kofi-button .kofiimg { margin-right: 0; }
    .kofi-button { padding: 6px 9px; }
  }
  /* The buttons are pinned to the ends of the bar at every width, so the
     row that holds them only needs to take up no space of its own. */
  .header-btns {
    display: block;
    width: 0;
    height: 0;
  }
  /* IM Fell English. It has only one weight, so it must not be given
     a bolder one or the browser fakes a bold and blurs the letterforms.
     The fallbacks are old-style serifs already on most machines. */
  header h1 {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.03em;
    color: #ffffea;
  }
  #map { height: 260px; width: 100%; }


  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
  }
  .filter-btn {
    border: 1px solid var(--line);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--btn-active);
    color: var(--btn-active-text);
  }

  /* Scoped to the event type row so the date filters and the
     "More info" buttons keep their existing grey look. */
  #typeFilters .filter-btn {
    background: var(--type-btn-bg);
    border-color: var(--type-btn-line);
    color: #111111;
  }
  #typeFilters .filter-btn.active {
    background: var(--type-btn-active);
    border-color: #963a0c;
    color: #ffffff;
  }
  #typeFilters .filter-btn:hover {
    background: #ffdb66;
  }
  #typeFilters .filter-btn.active:hover {
    background: #963a0c;
  }

  #dateRangeBox {
    display: none;
    gap: 8px;
    padding: 0 16px 10px;
    align-items: center;
  }
  #dateRangeBox input { padding: 4px; }

  #eventList {
    padding: 0 16px 20px;
  }
  /* The invitation to submit an event, sat under the list. IM Fell has one
     weight only, so like the page title it must not be given a bolder one
     or the browser fakes a bold and blurs the letterforms. */
  #submitPrompt {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 1.05rem;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    text-align: center;
    margin: 0;
    padding: 0 16px 40px;
  }
  #submitPrompt a { color: var(--text); text-decoration: underline; }
  #submitPrompt a:hover { text-decoration: none; }
  .event {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .event:last-child { border-bottom: none; }
  .event-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 6px; }
  .event-line { margin-bottom: 4px; font-size: 0.92rem; opacity: 0.9; }
  .event-line a { color: inherit; }

  #status { padding: 20px 16px; opacity: 0.7; }

  .venue-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
  .venue-address { font-size: 0.8rem; font-style: italic; opacity: 0.75; margin-bottom: 14px; }
  .venue-events { max-height: 180px; overflow-y: auto; }
  .venue-event-line {
    display: flex;
    /* The trailing space in the date/time text is trimmed as a flex
       item, so the gap supplies the space before the event name. */
    gap: 0.3em;
    margin-bottom: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .venue-event-datetime {
    flex-shrink: 0;
    color: #000000;
  }
  .venue-event-link {
    color: #b82e00;
    text-decoration: none;
  }
  .venue-event-link:hover {
    text-decoration: underline;
  }
  .event { transition: background 0.4s, box-shadow 0.4s; }
  .event.highlight {
    background: var(--hl-bg);
    color: var(--hl-text);
    box-shadow: -16px 0 0 var(--hl-bg), 16px 0 0 var(--hl-bg);
  }

  /* The map tiles are light and can't follow the theme, so the map is
     framed in the palette's gold to read as a deliberate panel. The
     popup is restyled to match the rest of the page. */
  #map {
    border-bottom: 2px solid #cc9900;
  }
  /* Popups sit on a cream panel in both themes, so their text is set
     to black rather than following the theme. The artist/event name
     keeps the palette's orange. */
  .leaflet-popup-content-wrapper {
    background: #ffffea;
    color: #000000;
    border-radius: 8px;
  }
  .leaflet-popup-tip { background: #ffffea; }
  .venue-name, .venue-address { color: #000000; }
  .leaflet-container a.leaflet-popup-close-button { color: #000000; }
  .leaflet-container a.leaflet-popup-close-button:hover { color: #666666; }
  #map .venue-event-link { color: #b82e00; }
  /* divIcon draws no box of its own, so the default marker chrome is
     cleared away. */
  .map-pin {
    background: none;
    border: none;
    cursor: pointer;
  }

  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  #modalOverlay.open { display: flex; }
  #modalBox {
    position: relative;
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  #modalClose {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }
  /* Leaves room for the close button in the top right, so the heart
     on the title row doesn't sit underneath it. */
  #modalContent .event-head { padding-right: 34px; margin-bottom: 10px; }
  #modalContent .event-head .event-title { margin-bottom: 0; }
  #modalContent .event-title { font-size: 1.2rem; }
  #modalContent .event-line { margin-bottom: 8px; }
  #modalContent a.ticket-link {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 16px;
    background: var(--btn-active);
    color: var(--btn-active-text);
    border-radius: 16px;
    text-decoration: none;
  }

  /* The venue name doubles as a link back to the map pin. */
  #modalContent a.venue-jump {
    color: var(--link);
    text-decoration: underline;
    cursor: pointer;
  }

  /* In the list the venue keeps the normal text colour and has no
     underline, so it doesn't read as a link until you point at it. */
  .event-line a.venue-jump-inline {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  .event-line a.venue-jump-inline:hover { text-decoration: underline; }

  /* Padding comes from .filter-row, so this row sits the same distance
     from the date filters as they do from the type filters. */
  #favFilterRow { align-items: center; }
  #favFilterRow .filter-btn { border-color: #cc9900; color: var(--text); }
  #favFilterRow .filter-btn.active {
    background: var(--type-btn-active);
    color: #ffffff;
    border-color: #963a0c;
  }
  #favFilterRow .filter-btn:disabled { opacity: 0.45; cursor: default; }
  #favCount { font-size: 0.85rem; opacity: 0.7; }

  /* Drawn as an SVG rather than a text character, so its shape and
     its height are the same in every browser. The box is fixed, and
     the heart is centred inside it, so it can never spill below the
     title line. */
  .fav-btn {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
    color: var(--fav-empty);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    flex-shrink: 0;
  }
  .fav-btn.on { color: var(--fav-on); }
  .fav-btn svg { display: block; width: 1.6rem; height: 1.46rem; }
  .fav-btn:hover { color: var(--fav-hover); }
  .fav-btn.on:hover { color: var(--fav-on-dark); }

  /* align-items:center centres each item on the title's margin box,
     so the title's own bottom margin would drag the heart off line.
     The gap below the row is set here instead. */
  .event-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 6px;
  }
  .event-head .event-title { flex: 1; margin-bottom: 0; }

  #modalContent .fav-btn { width: 2.75rem; height: 2.75rem; }
  #modalContent .fav-btn svg { width: 1.75rem; height: 1.6rem; }

  /* ---- Slide-out menu ---- */
  #menuBtn {
    border: 1px solid #cc9900;
    background: #ffcc33;
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    height: 32px;
  }
  #menuBtn:hover { background: #ffdb66; }
  /* Drawn as an SVG rather than a text character, so its shape and its
     height are the same in every browser. */
  #menuBtn svg { display: block; width: 20px; height: 16px; }
  #menuBtn svg line {
    stroke: #210000;
    stroke-width: 2.2;
    stroke-linecap: round;
  }

  /* The shade over the page. Tapping it closes the menu, so it needs a
     cursor that says so. */
  #menuShade {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1100;
  }
  #menuShade.open { display: block; }

  /* The panel itself, sliding in from the left. */
  #menuPanel {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 280px;
    max-width: 82vw;
    background: var(--bg);
    color: var(--text);
    border-right: 2px solid #cc9900;
    padding: 16px 20px 24px;
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 1101;
  }
  #menuPanel.open { transform: translateX(0); }

  #menuClose {
    display: block;
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
  }
  #menuClose:hover { color: #b04411; }
  #menuHeading {
    font-family: 'IM Fell English', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 1.4rem;
    margin: 10px 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .menu-link {
    display: block;
    padding: 12px 0;
    color: var(--link);
    text-decoration: underline;
    font-size: 1.05rem;
  }
  .menu-link:hover { text-decoration: none; }
  /* The dark mode option is a button rather than a link, but it is listed
     alongside the links and has to look identical to them. Buttons come
     with a background and a border of their own, so both are cleared. */
  .menu-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 0;
    background: none;
    border: 0;
    border-radius: 0;
    color: var(--link);
    font-family: inherit;
    font-size: 1.05rem;
    line-height: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .menu-btn:hover { text-decoration: none; }
</style>
</head>
<body class="dark">

  <header>
    <h1>The Kirn</h1>
    <div class="header-btns">
      <button id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
        <svg viewBox="0 0 20 16" aria-hidden="true" focusable="false">
          <line x1="0" y1="2" x2="20" y2="2"/>
          <line x1="0" y1="8" x2="20" y2="8"/>
          <line x1="0" y1="14" x2="20" y2="14"/>
        </svg>
      </button>
      <div id="kofiSlot">
        <a class="kofi-button" title="Support me on ko-fi.com"
           href="https://ko-fi.com/D7F8284K0C" target="_blank" rel="noopener noreferrer">
          <img class="kofiimg" src="https://storage.ko-fi.com/cdn/cup-border.png"
               alt="Ko-fi donations"><span class="kofi-word">Donate</span>
        </a>
      </div>
    </div>
  </header>

  <div id="menuShade"></div>
  <div id="menuPanel">
    <button id="menuClose" aria-label="Close menu">&times;</button>
    <div id="menuHeading">Menu</div>
    <a class="menu-link" href="submit.html" id="menuSubmit">Submit An Event</a>
    <a class="menu-link" href="https://ko-fi.com/thekirn" id="menuSupport"
       target="_blank" rel="noopener noreferrer">Support</a>
    <button id="darkToggle" class="menu-btn">Dark mode</button>
  </div>

  <div id="map"></div>

  <div class="filter-row" id="typeFilters">
    <button class="filter-btn" data-type="gigs">Gigs</button>
    <button class="filter-btn" data-type="sessions">Sessions</button>
    <button class="filter-btn" data-type="dance">Dance</button>
    <button class="filter-btn" data-type="crafts">Crafts</button>
    <button class="filter-btn" data-type="markets">Markets</button>
    <button class="filter-btn" data-type="spokenword">Spoken Word</button>
    <button class="filter-btn" data-type="other">Other</button>
  </div>

  <div class="filter-row" id="dateFilters">
    <button class="filter-btn" data-range="today">Today</button>
    <button class="filter-btn" data-range="week">This Week</button>
    <button class="filter-btn" data-range="weekend">This Weekend</button>
    <button class="filter-btn" data-range="month">This Month</button>
    <button class="filter-btn" data-range="custom">Choose Dates</button>
    <button class="filter-btn active" data-range="all">All</button>
  </div>

  <div class="filter-row" id="favFilterRow">
    <button class="filter-btn" id="favFilter">Favourites</button>

  <div id="dateRangeBox">
    <input type="date" id="dateFrom"> to
    <input type="date" id="dateTo">
  </div>

  <div id="status">Loading events...</div>
  <div id="eventList"></div>

  <p id="submitPrompt">Something missing? Submit an event <a href="submit.html">here</a></p>

  <div id="modalOverlay">
    <div id="modalBox">
      <button id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
// ============================================================
// CONFIG - paste your published Google Sheet CSV link here
// ============================================================
const CONFIG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtJN8W8AwbpQfUMykoANi9RfW6XA8ghJ-F-vagUGkQ8Ep5PWTbyae6f45kLlCVEpwJS2Mg0U9eKdz4/pub?gid=514788102&single=true&output=csv'
};

// Which of your Sheet's Category values count under each button.
// Edit these lists any time to match your own category names.
const TYPE_GROUPS = {
  gigs: ['Folk Music'],
  sessions: ['Music Session'],
  dance: ['Ceilidh / Social Dance', 'Traditional Dance'],
  crafts: ['Heritage Workshop'],
  markets: ['Market'],
  spokenword: ['Spoken Word'],
  other: ['Other']
};

let allEvents = [];
// Newcastle city centre, used as the map's starting point.
const DEFAULT_CENTRE = [54.9783, -1.6178];
const DEFAULT_ZOOM = 12;
// Set once the map has opened wide enough to show every pin, so later
// filter changes leave the visitor's chosen view alone.
let mapHasFitted = false;
let activeTypes = new Set();
let activeRange = 'all';
let favouritesOnly = false;
let map, markersLayer;
let venueMarkers = {};

// ---- Favourites ----
// Stored in this browser only. Never sent anywhere.
// Do not rename this string: every saved favourite is filed under it, so
// changing it makes everyone's favourites look as though they had vanished.
const FAV_KEY = 'newcastleFolkFavourites';
let favIds = new Set();

// Where the visitor last had the map panned and zoomed to. Also browser
// only. A separate name from FAV_KEY so the two cannot overwrite each
// other.
const MAP_KEY = 'kirnMapView';
let suppressMapSave = false;
// True when this visitor had a view of their own from a previous visit.
let hasSavedMapView = false;

function loadFavourites() {
  try {
    const raw = localStorage.getItem(FAV_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) favIds = new Set(parsed.filter(x => typeof x === 'string'));
  } catch (err) {
    // Storage blocked - favourites still work, just not remembered.
    favIds = new Set();
  }
}

function saveFavourites() {
  try {
    localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favIds)));
  } catch (err) {
    // Could not persist - keep the in-memory copy working.
  }
}

function isFavourite(e) {
  return favIds.has(favId(e));
}

// EventID is built as date|venue|title, so it survives the sheet
// being rewritten. Mirrors that same shape if EventID is blank.
function favId(e) {
  if (e.eventId) return e.eventId;
  const norm = t => String(t || '').toLowerCase()
    .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  return e.date + '|' + norm(e.venue) + '|' + norm(e.title);
}

function toggleFavourite(e) {
  const id = favId(e);
  if (favIds.has(id)) favIds.delete(id);
  else favIds.add(id);
  saveFavourites();
  render();
}

// Outline heart when not favourited, solid when it is.
function favButtonHtml(e, extraClass) {
  const on = isFavourite(e);
  const label = on ? 'Remove from favourites' : 'Add to favourites';
  const heart = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M12 20.7l-1.3-1.2C6.1 15.3 3.4 12.8 3.4 9.6 3.4 7 5.3 5 7.9 5c1.5 0 2.9.7 3.8 1.8l.3.4.3-.4C13.2 5.7 14.6 5 16.1 5c2.6 0 4.5 2 4.5 4.6 0 3.2-2.7 5.7-7.3 9.9L12 20.7z" ' +
    (on ? 'fill="currentColor" stroke="currentColor" stroke-width="1.4"'
        : 'fill="none" stroke="currentColor" stroke-width="1.8"') +
    ' stroke-linejoin="round"/></svg>';
  return '<button class="fav-btn' + (on ? ' on' : '') + (extraClass ? ' ' + extraClass : '') + '"' +
    ' data-dom-id="' + e.domId + '"' +
    ' aria-pressed="' + (on ? 'true' : 'false') + '"' +
    ' aria-label="' + label + '"' +
    ' title="' + label + '">' + heart + '</button>';
}

// Pins sit at Leaflet's default size when unselected, drawn in the
// palette's rust. Only the selected pin grows and darkens, so the
// difference between the two states is easy to pick out.
const PIN_SELECTED_H = 47;

function pinIcon(selected) {
  const w = selected ? 29 : 25;
  const h = selected ? 47 : 41;
  const body = selected ? '#7A1A0A' : '#B04411';
  const edge = selected ? '#3A0D02' : '#7A1A0A';
  const html =
    '<svg viewBox="0 0 24 36" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path d="M12 35.2C12 35.2 22 22.6 22 12.4A10 10 0 0 0 2 12.4C2 22.6 12 35.2 12 35.2Z" ' +
        'fill="' + body + '" stroke="' + edge + '" stroke-width="1.6"/>' +
      '<circle cx="12" cy="12.4" r="3.7" fill="#ffffea"/>' +
    '</svg>';
  return L.divIcon({
    html: html,
    className: 'map-pin',
    iconSize: [w, h],
    iconAnchor: [w / 2, h],
    popupAnchor: [0, -h]
  });
}

// Leaflet pans to fit a popup on its own, but a long list in a short
// map can still leave the pin covered. The scrolling list is capped so
// the popup and the pin fit together, then the map is panned the
// minimum amount needed to bring the top of the popup into view.
function showPinWithPopup(marker) {
  const el = marker.getPopup().getElement();
  const listEl = el && el.querySelector('.venue-events');
  if (!listEl) return;
  const size = map.getSize();
  const chrome = el.offsetHeight - listEl.offsetHeight;
  const roomForList = size.y - PIN_SELECTED_H - chrome - 24;
  listEl.style.maxHeight = Math.max(60, roomForList) + 'px';
  // Reading the height back forces the layout to settle.
  const popupH = el.offsetHeight;
  const tip = map.latLngToContainerPoint(marker.getLatLng());
  const popupTop = tip.y - PIN_SELECTED_H - popupH;
  if (popupTop < 8) map.panBy([0, popupTop - 8]);
}

function initMap() {
  const saved = loadSavedMapView();
  hasSavedMapView = !!saved;
  map = L.map('map').setView(
    saved ? [saved.lat, saved.lng] : DEFAULT_CENTRE,
    saved ? saved.zoom : DEFAULT_ZOOM
  );
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
  // Remembering where someone had panned and zoomed to is useful on their
  // own machine, so it is written back as they move. Kept off the end so
  // it fires once the move has settled rather than on every frame.
  map.on('moveend zoomend', saveMapView);
}

function loadSavedMapView() {
  try {
    const raw = localStorage.getItem(MAP_KEY);
    if (!raw) return null;
    const v = JSON.parse(raw);
    if (typeof v !== 'object' || v === null) return null;
    const lat = Number(v.lat), lng = Number(v.lng), zoom = Number(v.zoom);
    if (!isFinite(lat) || !isFinite(lng) || !isFinite(zoom)) return null;
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
    if (zoom < 1 || zoom > 18) return null;
    return { lat: lat, lng: lng, zoom: zoom };
  } catch (err) {
    // Storage blocked or the value is unreadable - just start normally.
    return null;
  }
}

function saveMapView() {
  // The automatic fit that happens on a first visit is not a choice the
  // visitor made, so it is not written down as though it were.
  if (suppressMapSave) return;
  try {
    const c = map.getCenter();
    localStorage.setItem(MAP_KEY, JSON.stringify({
      lat: Math.round(c.lat * 100000) / 100000,
      lng: Math.round(c.lng * 100000) / 100000,
      zoom: map.getZoom()
    }));
  } catch (err) {
    // No storage, or no room left - the map still works, it just forgets.
  }
}

// Zooms the map so every pin currently on it is visible, used once on
// first load so the map opens showing the whole area rather than a fixed
// stretch of Newcastle that may cut off Whitley Bay, Jarrow or the coast.
//
// A single pin would otherwise fill the screen at maximum zoom, so with
// only one (or none) the normal view is kept.
function fitMapToPins() {
  if (!map || !map.fitBounds) return false;
  const pts = [];
  markersLayer.eachLayer(m => {
    const p = m.getLatLng();
    if (p) pts.push([p.lat, p.lng]);
  });
  // One pin, or none, would zoom to maximum on a single point, so the
  // normal Newcastle view is left alone.
  if (pts.length < 2) return false;
  // The map can be asked to fit before it has settled to its real size,
  // which would give the wrong answer, so make sure it has.
  if (map.invalidateSize) map.invalidateSize();
  // Jumps rather than animates. Leaflet's zoom animation can be left
  // part-finished when the events are still arriving, and a half-finished
  // zoom leaves the map at its old level with pins off screen.
  map.fitBounds(pts, { padding: [30, 30], maxZoom: DEFAULT_ZOOM, animate: false });
  return true;
}

// Fits the map, without that choice being remembered as the visitor's own.
function autoFitMapToPins() {
  suppressMapSave = true;
  try {
    return fitMapToPins();
  } finally {
    suppressMapSave = false;
  }
}

function loadEvents() {
  Papa.parse(CONFIG.CSV_URL, {
    download: true,
    header: true,
    complete: function(results) {
      allEvents = results.data
        .filter(row => row.Title && row.Date)
        .map((row, idx) => ({
          eventId: row.EventID || '',
          domId: 'event-' + idx + '-' + (row.EventID || row.Title).replace(/[^a-zA-Z0-9]/g, '').slice(0, 40),
          title: row.Title,
          description: row.Description,
          category: row.Category || '',
          date: row.Date,
          startTime: row.StartTime || '',
          endTime: row.EndTime || '',
          venue: row.Venue || '',
          address: row.Address || '',
          lat: parseFloat(row.Lat),
          lng: parseFloat(row.Lng),
          sourceUrl: row.SourceURL || ''
        }));
      document.getElementById('status').style.display = 'none';
      render();
    },
    error: function() {
      document.getElementById('status').textContent =
        'Could not load events - check the CSV link in CONFIG.';
    }
  });
}

function todayStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  // Built from the local date parts rather than toISOString().
  // toISOString() reports the date in UTC, which is an hour ahead
  // of us for most of the year - so late in the evening it would
  // hand back tomorrow's date and quietly drop today's events out
  // of the "Today" filter.
  const m = ('0' + (d.getMonth() + 1)).slice(-2);
  const day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}

// The week starts on Monday, so this returns the Monday of the week
// that the given date falls in.
function startOfWeek(date) {
  const day = date.getDay(); // 0=Sun..6=Sat
  const daysSinceMonday = (day === 0) ? 6 : day - 1;
  const monday = new Date(date);
  monday.setDate(date.getDate() - daysSinceMonday);
  return monday;
}

function passesDateFilter(dateStr) {
  if (activeRange === 'all') return true;
  const today = new Date(todayStr());
  const eventDate = new Date(dateStr);

  if (activeRange === 'today') return dateStr === todayStr();

  if (activeRange === 'week') {
    const monday = startOfWeek(today);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return eventDate >= monday && eventDate <= sunday;
  }
  if (activeRange === 'weekend') {
    // The Saturday and Sunday of the week we are currently in, so
    // Friday looks forward and Sunday looks back at the day before.
    const monday = startOfWeek(today);
    const sat = new Date(monday); sat.setDate(monday.getDate() + 5);
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    return eventDate >= sat && eventDate <= sun;
  }
  if (activeRange === 'month') {
    return eventDate.getMonth() === today.getMonth() &&
      eventDate.getFullYear() === today.getFullYear();
  }
  if (activeRange === 'custom') {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    if (!from || !to) return true;
    return dateStr >= from && dateStr <= to;
  }
  return true;
}

function passesTypeFilter(category) {
  if (activeTypes.size === 0) return true;
  for (const type of activeTypes) {
    if ((TYPE_GROUPS[type] || []).includes(category)) return true;
  }
  return false;
}

// Identifies which pin an event belongs to. Grouping ignores the word
// "The" (case-insensitive) and also uses postcode as a fallback so
// that venues with slightly different names but the same postcode are
// grouped together. Shared with the modal so both always agree.
function venueKeyFor(e) {
  const venueNorm = (e.venue || '')
    .toLowerCase()
    .replace(/^the\s+/, '')    // strip leading "The"
    .replace(/\s+the\s+/g, ' ') // strip "The" in the middle
    .replace(/[^a-z0-9]/g, '')  // remove non-alphanumeric
    .trim();
  // Extract postcode from address if available
  const postcodeMatch = (e.address || '').match(/([A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2})/i);
  const postcode = postcodeMatch ? postcodeMatch[1].replace(/\s+/g, '') : '';
  // If we have neither (an event with no venue and no usable address),
  // fall back to the exact coordinates so those events don't all
  // collapse onto one pin.
  return (venueNorm || postcode) ? venueNorm + '|' + postcode : e.lat + ',' + e.lng;
}

function render() {
  // Runs before the list is built, so that removing the last
  // favourite switches the filter off and the events reappear in the
  // same pass rather than showing an empty list first.
  updateFavCount();

  const filtered = allEvents
    .filter(e => passesTypeFilter(e.category) && passesDateFilter(e.date))
    .filter(e => !favouritesOnly || isFavourite(e))
    .sort((a, b) => a.date.localeCompare(b.date));

  markersLayer.clearLayers();
  venueMarkers = {};

  // One pin per venue, however many events are on there.
  const venueGroups = {};
  filtered.forEach(e => {
    if (!e.lat || !e.lng) return;
    const venueKey = venueKeyFor(e);
    if (!venueGroups[venueKey]) {
      venueGroups[venueKey] = { venue: e.venue, address: e.address, lat: e.lat, lng: e.lng, events: [] };
    }
    if (!venueGroups[venueKey].address && e.address) venueGroups[venueKey].address = e.address;
    venueGroups[venueKey].events.push(e);
  });
  Object.keys(venueGroups).forEach(key => {
    const g = venueGroups[key];
    const marker = L.marker([g.lat, g.lng], { icon: pinIcon(false) }).addTo(markersLayer)
      .bindPopup(buildVenuePopup(g), { maxWidth: 320 });
    // Darken the pin while its popup is open, so the selected venue is
    // obvious without having to read the popup.
    marker.on('popupopen', () => {
      marker.setIcon(pinIcon(true));
      showPinWithPopup(marker);
    });
    marker.on('popupclose', () => marker.setIcon(pinIcon(false)));
    venueMarkers[key] = marker;
  });

  // On the very first pass, open the map wide enough to show every pin.
  // Only once, so that tapping a filter afterwards doesn't yank the view
  // away from wherever the visitor has moved it.
  //
  // Skipped when the map came back at a position the visitor chose
  // themselves on an earlier visit, as that always beats the automatic fit.
  if (!mapHasFitted && !hasSavedMapView) {
    if (autoFitMapToPins()) mapHasFitted = true;
  }

  const list = document.getElementById('eventList');
  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div id="status">No events match these filters.</div>';
    return;
  }

  filtered.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'event';
    div.id = e.domId;
    // The venue is clickable when this event has a pin to jump to.
    const key = venueKeyFor(e);
    const venueHtml = (e.venue && venueMarkers[key])
      ? '<a href="#" class="venue-jump-inline" data-venue-key="' + esc(key) + '">' +
          esc(e.venue) + '</a>'
      : esc(e.venue);
    div.innerHTML =
      '<div class="event-head">' +
        '<div class="event-title">' + esc(e.title) + '</div>' +
        favButtonHtml(e) +
      '</div>' +
      '<div class="event-line">' + esc(formatDateDisplay(e.date)) +
        (e.startTime ? ', ' + esc(formatTimeDisplay(e.startTime)) : '') + '</div>' +
      '<div class="event-line">' + venueHtml + '</div>' +
      (e.category ? '<div class="event-line">' + esc(e.category) + '</div>' : '') +
      '<button class="filter-btn more-info-btn" data-index="' + i + '">More info</button>';
    list.appendChild(div);
  });

  // Store the currently filtered list so the More info buttons
  // (added just above) can look up the right event by index.
  window.currentFilteredEvents = filtered;
}

function updateFavCount() {
  const countEl = document.getElementById('favCount');
  const btn = document.getElementById('favFilter');
  const n = favIds.size;
  if (n === 0) {
    countEl.textContent = '';
  } else {
    countEl.textContent = n + (n === 1 ? ' favourite' : ' favourites');
  }
  // With nothing saved, grey the filter out rather than letting
  // someone click into an empty list.
  btn.disabled = (n === 0);
  if (n === 0) {
    favouritesOnly = false;
    btn.classList.remove('active');
  }
}

// Turns a value from the sheet into something safe to drop into
// innerHTML, so a stray < or & in a title shows as typed instead of
// being read as markup.
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Ticket links come from scraped sources, so only real web addresses
// are turned into links. Anything else (a javascript: URL, or junk)
// is ignored rather than made clickable.
function isSafeUrl(url) {
  return /^https?:\/\//i.test(String(url || '').trim());
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'short' });
  const month = d.toLocaleDateString('en-GB', { month: 'short' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

// Venue name and address at the top, then one clickable line per
// event: "Sun 25th Oct - 7:30pm - Event title".
// Only the event title is a link (not the date/time), and when the
// title wraps to a new line it stays aligned with the start of the
// title rather than dropping back under the date.
function buildVenuePopup(g) {
  let html = '<div class="venue-popup"><div class="venue-name">' +
    esc(g.venue || 'Event location') + '</div>';
  if (g.address) html += '<div class="venue-address">' + esc(g.address) + '</div>';
  html += '<div class="venue-events">';
  g.events.forEach(e => {
    const time = e.startTime ? ' - ' + formatTimeDisplay(e.startTime) : '';
    const datetime = formatDateShort(e.date) + time + ' - ';
    html += '<div class="venue-event-line">' +
      '<span class="venue-event-datetime">' + esc(datetime) + '</span>' +
      '<a href="#" class="venue-event-link" onclick="scrollToEvent(\'' +
      e.domId + '\'); return false;">' + esc(e.title) + '</a>' +
      '</div>';
  });
  return html + '</div></div>';
}

// Closes the map popup and scrolls down to that event in the list,
// briefly highlighting it so it's easy to spot.
function scrollToEvent(domId) {
  const el = document.getElementById(domId);
  if (!el) return;
  map.closePopup();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 2000);
}

// Closes the details popup, scrolls back up to the map and opens that
// venue's pin. The map is only panned when the pin is off screen, so
// a venue already in view doesn't jump about.
function jumpToVenue(venueKey) {
  const marker = venueMarkers[venueKey];
  if (!marker) return;
  closeModal();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (!map.getBounds().contains(marker.getLatLng())) {
    map.setView(marker.getLatLng(), map.getZoom());
  }
  marker.openPopup();
}

// A link only counts as worth showing if it points somewhere
// event-specific. Crack Magazine's link is always just the same
// category listing page, not the actual event, so we hide it there.
function isGenericListingLink(url) {
  if (!url) return true;
  return url.indexOf('thecrackmagazine.com/whatson') !== -1;
}

let modalEvent = null;

function openModal(e) {
  modalEvent = e;
  paintModal();
  document.getElementById('modalOverlay').classList.add('open');
}

function paintModal() {
  const e = modalEvent;
  if (!e) return;
  const content = document.getElementById('modalContent');
  // The venue is a link only when this event actually has a pin.
  const venueKey = venueKeyFor(e);
  const venueHtml = venueMarkers[venueKey]
    ? '<a href="#" class="venue-jump" onclick="jumpToVenue(\'' + venueKey + '\'); return false;">' +
        esc(e.venue || 'Event location') + '</a>'
    : esc(e.venue);
  content.innerHTML =
    '<div class="event-head">' +
      '<div class="event-title">' + esc(e.title) + '</div>' +
      favButtonHtml(e, 'modal-fav-btn') +
    '</div>' +
    '<div class="event-line">' + esc(formatDateDisplay(e.date)) +
      (e.startTime ? ', ' + esc(formatTimeDisplay(e.startTime)) : '') + '</div>' +
    '<div class="event-line">' + venueHtml + '</div>' +
    (e.description ? '<div class="event-line">' + esc(e.description) + '</div>' : '') +
    (!isGenericListingLink(e.sourceUrl) && isSafeUrl(e.sourceUrl)
      ? '<a class="ticket-link" href="' + esc(e.sourceUrl) + '" target="_blank" rel="noopener noreferrer">More info</a>'
      : '');
  const btn = content.querySelector('.fav-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      const target = allEvents.find(x => x.domId === btn.dataset.domId);
      if (!target) return;
      toggleFavourite(target);
      // render() rebuilds the list but not the modal.
      if (document.getElementById('modalOverlay').classList.contains('open')) {
        paintModal();
      }
    });
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalEvent = null;
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (event) => {
  if (event.target.id === 'modalOverlay') closeModal();
});

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function formatDateDisplay(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  // Built from the parts directly (not new Date(dateStr)) so the
  // displayed day never shifts due to timezone rounding.
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'long' });
  const month = d.toLocaleDateString('en-GB', { month: 'long' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

function formatTimeDisplay(timeStr) {
  if (!timeStr) return '';
  const match = timeStr.match(/(\d{1,2}):(\d{2})/);
  if (!match) return timeStr; // unrecognised format - show as-is rather than hide it
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const suffix = hour >= 12 ? 'pm' : 'am';
  hour = hour % 12;
  if (hour === 0) hour = 12;
  return hour + (minute === '00' ? '' : ':' + minute) + suffix;
}

// ---- Wiring up the buttons ----

// The button names the mode it will switch to, not the one in use, so
// it reads "Light mode" while dark is on.
function updateThemeLabel() {
  document.getElementById('darkToggle').textContent =
    document.body.classList.contains('dark') ? 'Light mode' : 'Dark mode';
}

document.getElementById('darkToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  updateThemeLabel();
});

updateThemeLabel();

// ---- Slide-out menu ----
const menuPanel = document.getElementById('menuPanel');
const menuBtn = document.getElementById('menuBtn');
const menuShade = document.getElementById('menuShade');

function setMenuOpen(open) {
  menuPanel.classList.toggle('open', open);
  menuShade.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) menuPanel.scrollTop = 0;
}

menuBtn.addEventListener('click', () => setMenuOpen(!menuPanel.classList.contains('open')));
document.getElementById('menuClose').addEventListener('click', () => setMenuOpen(false));
menuShade.addEventListener('click', () => setMenuOpen(false));
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && menuPanel.classList.contains('open')) setMenuOpen(false);
});

// One handler for the whole event list, attached once. Every card is
// rebuilt on each filter change, so attaching a listener to each
// button individually meant re-attaching hundreds of them every time
// a filter was tapped. The list container never changes, so listening
// on it catches clicks on any card, present or future.
document.getElementById('eventList').addEventListener('click', ev => {
  const favBtn = ev.target.closest('.fav-btn');
  if (favBtn) {
    const e = allEvents.find(x => x.domId === favBtn.dataset.domId);
    if (e) toggleFavourite(e);
    return;
  }
  const venueLink = ev.target.closest('.venue-jump-inline');
  if (venueLink) {
    jumpToVenue(venueLink.dataset.venueKey);
    return;
  }
  const moreBtn = ev.target.closest('.more-info-btn');
  if (moreBtn) {
    const e = window.currentFilteredEvents[parseInt(moreBtn.dataset.index, 10)];
    if (e) openModal(e);
  }
});

document.querySelectorAll('#typeFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.type;
    if (activeTypes.has(type)) {
      activeTypes.delete(type);
      btn.classList.remove('active');
    } else {
      activeTypes.add(type);
      btn.classList.add('active');
    }
    render();
  });
});

function setDateRange(range) {
  // Pressing the button for the range that is already on switches it
  // back to All, so a single button turns the filter on and off.
  activeRange = (range === activeRange && range !== 'all') ? 'all' : range;
  document.querySelectorAll('#dateFilters .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.range === activeRange);
  });
  document.getElementById('dateRangeBox').style.display =
    activeRange === 'custom' ? 'flex' : 'none';
  render();
}

document.querySelectorAll('#dateFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => setDateRange(btn.dataset.range));
});

document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

document.getElementById('favFilter').addEventListener('click', () => {
  if (favIds.size === 0) return;
  favouritesOnly = !favouritesOnly;
  document.getElementById('favFilter').classList.toggle('active', favouritesOnly);
  render();
});
