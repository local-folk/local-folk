<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newcastle Folk Events</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  /* ============================================================
     PASTE YOUR PUBLISHED SHEET CSV LINK BELOW (see CONFIG in the
     <script> section near the bottom of this file)
     ============================================================ */

  :root {
    --bg: #ffffff;
    --text: #111111;
    --line: #dddddd;
    --btn-bg: #f0f0f0;
    --btn-active: #333333;
    --btn-active-text: #ffffff;
  }
  body.dark {
    --bg: #111111;
    --text: #f0f0f0;
    --line: #333333;
    --btn-bg: #222222;
    --btn-active: #eeeeee;
    --btn-active-text: #111111;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
  }
  header h1 { font-size: 1.3rem; margin: 0; }
  #darkToggle {
    border: 1px solid var(--line);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #map { height: 260px; width: 100%; }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 16px;
  }
  .filter-btn {
    border: 1px solid var(--line);
    background: var(--btn-bg);
    color: var(--text);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .filter-btn.active {
    background: var(--btn-active);
    color: var(--btn-active-text);
  }

  #dateRangeBox {
    display: none;
    gap: 8px;
    padding: 0 16px 10px;
    align-items: center;
  }
  #dateRangeBox input { padding: 4px; }

  #eventList {
    padding: 0 16px 40px;
  }
  .event {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .event:last-child { border-bottom: none; }
  .event-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 6px; }
  .event-line { margin-bottom: 4px; font-size: 0.92rem; opacity: 0.9; }
  .event-line a { color: inherit; }

  #status { padding: 20px 16px; opacity: 0.7; }

  .venue-name { font-weight: 700; font-size: 1rem; margin-bottom: 2px; }
  .venue-address { font-size: 0.8rem; font-style: italic; opacity: 0.75; margin-bottom: 14px; }
  .venue-events { max-height: 180px; overflow-y: auto; }
  .venue-event-line {
    display: flex;
    margin-bottom: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .venue-event-datetime {
    flex-shrink: 0;
    color: var(--text);
  }
  .venue-event-link {
    color: #1a5fb4;
    text-decoration: none;
  }
  .venue-event-link:hover {
    text-decoration: underline;
  }
  .event { transition: background 0.4s, box-shadow 0.4s; }
  .event.highlight {
    background: var(--btn-bg);
    box-shadow: -16px 0 0 var(--btn-bg), 16px 0 0 var(--btn-bg);
  }

  #modalOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  #modalOverlay.open { display: flex; }
  #modalBox {
    position: relative;
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 24px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  #modalClose {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.6rem;
    cursor: pointer;
    line-height: 1;
  }
  #modalContent .event-title { font-size: 1.2rem; margin-bottom: 10px; }
  #modalContent .event-line { margin-bottom: 8px; }
  #modalContent a.ticket-link {
    display: inline-block;
    margin-top: 8px;
    padding: 8px 16px;
    background: var(--btn-active);
    color: var(--btn-active-text);
    border-radius: 16px;
    text-decoration: none;
  }
</style>
</head>
<body>

  <header>
    <h1>Newcastle Folk Events</h1>
    <button id="darkToggle">Dark mode</button>
  </header>

  <div id="map"></div>

  <div class="filter-row" id="typeFilters">
    <button class="filter-btn" data-type="gigs">Gigs</button>
    <button class="filter-btn" data-type="sessions">Sessions</button>
    <button class="filter-btn" data-type="dance">Dance</button>
    <button class="filter-btn" data-type="crafts">Crafts</button>
    <button class="filter-btn" data-type="markets">Markets</button>
    <button class="filter-btn" data-type="spokenword">Spoken Word</button>
  </div>

  <div class="filter-row" id="dateFilters">
    <button class="filter-btn" data-range="today">Today</button>
    <button class="filter-btn" data-range="week">This Week</button>
    <button class="filter-btn" data-range="weekend">This Weekend</button>
    <button class="filter-btn" data-range="month">This Month</button>
    <button class="filter-btn" data-range="custom">Choose Dates</button>
    <button class="filter-btn active" data-range="all">All</button>
  </div>

  <div id="dateRangeBox">
    <input type="date" id="dateFrom"> to
    <input type="date" id="dateTo">
  </div>

  <div id="status">Loading events...</div>
  <div id="eventList"></div>

  <div id="modalOverlay">
    <div id="modalBox">
      <button id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

<script>
// ============================================================
// CONFIG - paste your published Google Sheet CSV link here
// ============================================================
const CONFIG = {
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtJN8W8AwbpQfUMykoANi9RfW6XA8ghJ-F-vagUGkQ8Ep5PWTbyae6f45kLlCVEpwJS2Mg0U9eKdz4/pub?gid=514788102&single=true&output=csv'
};

// Which of your Sheet's Category values count under each button.
// Edit these lists any time to match your own category names.
const TYPE_GROUPS = {
  gigs: ['Folk Music'],
  sessions: ['Music Session'],
  dance: ['Ceilidh / Social Dance', 'Traditional Dance'],
  crafts: ['Heritage Workshop'],
  markets: ['Market'],
  spokenword: ['Spoken Word']
};

let allEvents = [];
let activeTypes = new Set();
let activeRange = 'all';
let map, markersLayer;

function initMap() {
  map = L.map('map').setView([54.9783, -1.6178], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function loadEvents() {
  Papa.parse(CONFIG.CSV_URL, {
    download: true,
    header: true,
    complete: function(results) {
      allEvents = results.data
        .filter(row => row.Title && row.Date)
        .map((row, idx) => ({
          eventId: row.EventID || '',
          domId: 'event-' + idx + '-' + (row.EventID || row.Title).replace(/[^a-zA-Z0-9]/g, '').slice(0, 40),
          title: row.Title,
          description: row.Description,
          category: row.Category || '',
          date: row.Date,
          startTime: row.StartTime || '',
          endTime: row.EndTime || '',
          venue: row.Venue || '',
          address: row.Address || '',
          lat: parseFloat(row.Lat),
          lng: parseFloat(row.Lng),
          sourceUrl: row.SourceURL || ''
        }));
      document.getElementById('status').style.display = 'none';
      render();
    },
    error: function() {
      document.getElementById('status').textContent =
        'Could not load events - check the CSV link in CONFIG.';
    }
  });
}

function todayStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  return d.toISOString().slice(0, 10);
}

function passesDateFilter(dateStr) {
  if (activeRange === 'all') return true;
  const today = new Date(todayStr());
  const eventDate = new Date(dateStr);

  if (activeRange === 'today') return dateStr === todayStr();

  if (activeRange === 'week') {
    const weekEnd = new Date(today); weekEnd.setDate(today.getDate() + 7);
    return eventDate >= today && eventDate <= weekEnd;
  }
  if (activeRange === 'weekend') {
    const day = today.getDay(); // 0=Sun..6=Sat
    const satOffset = (6 - day + 7) % 7;
    const sat = new Date(today); sat.setDate(today.getDate() + satOffset);
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    return eventDate >= sat && eventDate <= sun;
  }
  if (activeRange === 'month') {
    return eventDate.getMonth() === today.getMonth() &&
      eventDate.getFullYear() === today.getFullYear();
  }
  if (activeRange === 'custom') {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    if (!from || !to) return true;
    return dateStr >= from && dateStr <= to;
  }
  return true;
}

function passesTypeFilter(category) {
  if (activeTypes.size === 0) return true;
  for (const type of activeTypes) {
    if ((TYPE_GROUPS[type] || []).includes(category)) return true;
  }
  return false;
}

function render() {
  const filtered = allEvents
    .filter(e => passesTypeFilter(e.category) && passesDateFilter(e.date))
    .sort((a, b) => a.date.localeCompare(b.date));

  markersLayer.clearLayers();

  // One pin per venue, however many events are on there.
  // Grouping ignores the word "The" (case-insensitive) so that
  // "The Cluny 2" and "Cluny 2" are treated as the same venue,
  // but "Cluny" and "Cluny 2" remain separate.
  const venueGroups = {};
  filtered.forEach(e => {
    if (!e.lat || !e.lng) return;
    const venueKey = (e.venue || '')
      .toLowerCase()
      .replace(/^the\s+/, '')   // strip leading "The"
      .replace(/\s+the\s+/g, ' ') // strip "The" in the middle
      .replace(/[^a-z0-9]/g, '')  // remove non-alphanumeric
      .trim() || (e.lat + ',' + e.lng);
    if (!venueGroups[venueKey]) {
      venueGroups[venueKey] = { venue: e.venue, address: e.address, lat: e.lat, lng: e.lng, events: [] };
    }
    if (!venueGroups[venueKey].address && e.address) venueGroups[venueKey].address = e.address;
    venueGroups[venueKey].events.push(e);
  });
  Object.values(venueGroups).forEach(g => {
    L.marker([g.lat, g.lng]).addTo(markersLayer)
      .bindPopup(buildVenuePopup(g), { maxWidth: 320 });
  });

  const list = document.getElementById('eventList');
  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div id="status">No events match these filters.</div>';
    return;
  }

  filtered.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'event';
    div.id = e.domId;
    div.innerHTML =
      '<div class="event-title">' + e.title + '</div>' +
      '<div class="event-line">' + formatDateDisplay(e.date) +
        (e.startTime ? ', ' + formatTimeDisplay(e.startTime) : '') + '</div>' +
      '<div class="event-line">' + e.venue + '</div>' +
      (e.category ? '<div class="event-line">' + e.category + '</div>' : '') +
      '<button class="filter-btn more-info-btn" data-index="' + i + '">More info</button>';
    list.appendChild(div);
  });

  // Store the currently filtered list so the More info buttons
  // (added just above) can look up the right event by index.
  window.currentFilteredEvents = filtered;
  document.querySelectorAll('.more-info-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openModal(window.currentFilteredEvents[parseInt(btn.dataset.index, 10)]);
    });
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDateShort(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'short' });
  const month = d.toLocaleDateString('en-GB', { month: 'short' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

// Venue name and address at the top, then one clickable line per
// event: "Sun 25th Oct - 7:30pm - Event title".
// Only the event title is a link (not the date/time), and when the
// title wraps to a new line it stays aligned with the start of the
// title rather than dropping back under the date.
function buildVenuePopup(g) {
  let html = '<div class="venue-popup"><div class="venue-name">' +
    esc(g.venue || 'Event location') + '</div>';
  if (g.address) html += '<div class="venue-address">' + esc(g.address) + '</div>';
  html += '<div class="venue-events">';
  g.events.forEach(e => {
    const time = e.startTime ? ' - ' + formatTimeDisplay(e.startTime) : '';
    const datetime = formatDateShort(e.date) + time + ' - ';
    html += '<div class="venue-event-line">' +
      '<span class="venue-event-datetime">' + esc(datetime) + '</span>' +
      '<a href="#" class="venue-event-link" onclick="scrollToEvent(\'' +
      e.domId + '\'); return false;">' + esc(e.title) + '</a>' +
      '</div>';
  });
  return html + '</div></div>';
}

// Closes the map popup and scrolls down to that event in the list,
// briefly highlighting it so it's easy to spot.
function scrollToEvent(domId) {
  const el = document.getElementById(domId);
  if (!el) return;
  map.closePopup();
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 2000);
}

// A link only counts as worth showing if it points somewhere
// event-specific. Crack Magazine's link is always just the same
// category listing page, not the actual event, so we hide it there.
function isGenericListingLink(url) {
  if (!url) return true;
  return url.indexOf('thecrackmagazine.com/whatson') !== -1;
}

function openModal(e) {
  const content = document.getElementById('modalContent');
  content.innerHTML =
    '<div class="event-title">' + e.title + '</div>' +
    '<div class="event-line">' + formatDateDisplay(e.date) +
      (e.startTime ? ', ' + formatTimeDisplay(e.startTime) : '') + '</div>' +
    '<div class="event-line">' + e.venue + '</div>' +
    (e.description ? '<div class="event-line">' + e.description + '</div>' : '') +
    (!isGenericListingLink(e.sourceUrl)
      ? '<a class="ticket-link" href="' + e.sourceUrl + '" target="_blank">View / book tickets</a>'
      : '');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', (event) => {
  if (event.target.id === 'modalOverlay') closeModal();
});

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function formatDateDisplay(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return dateStr;
  // Built from the parts directly (not new Date(dateStr)) so the
  // displayed day never shifts due to timezone rounding.
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  if (isNaN(d)) return dateStr;
  const weekday = d.toLocaleDateString('en-GB', { weekday: 'long' });
  const month = d.toLocaleDateString('en-GB', { month: 'long' });
  return weekday + ' ' + ordinal(d.getDate()) + ' ' + month;
}

function formatTimeDisplay(timeStr) {
  if (!timeStr) return '';
  const match = timeStr.match(/(\d{1,2}):(\d{2})/);
  if (!match) return timeStr; // unrecognised format - show as-is rather than hide it
  let hour = parseInt(match[1], 10);
  const minute = match[2];
  const suffix = hour >= 12 ? 'pm' : 'am';
  hour = hour % 12;
  if (hour === 0) hour = 12;
  return hour + (minute === '00' ? '' : ':' + minute) + suffix;
}

// ---- Wiring up the buttons ----
document.getElementById('darkToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
});

document.querySelectorAll('#typeFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.type;
    if (activeTypes.has(type)) {
      activeTypes.delete(type);
      btn.classList.remove('active');
    } else {
      activeTypes.add(type);
      btn.classList.add('active');
    }
    render();
  });
});

document.querySelectorAll('#dateFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#dateFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeRange = btn.dataset.range;
    document.getElementById('dateRangeBox').style.display =
      activeRange === 'custom' ? 'flex' : 'none';
    render();
  });
});

document.getElementById('dateFrom').addEventListener('change', render);
document.getElementById('dateTo').addEventListener('change', render);

initMap();
loadEvents();
</script>
</body>
</html>
