# Renders the roundup images for thekirn.co.uk social posts, and builds the
# queue the approval email is made from.
#
# Two variants: Weekly (posted Monday 07:00 UTC) and Weekend (posted Thursday
# 12:00 UTC). Images render to social/archive/ so there is a permanent,
# browsable history on the site, and social/queue.json is committed so Apps
# Script can pick the post up, email it for approval, and later publish it.
#
# This workflow only generates. It never calls Meta and holds no Meta
# credentials - publishing is Apps Script's job (social.gs).
#
# Setup: nothing to configure. Fonts are committed under fonts/ and embedded in
# the SVG, so there is no build-time download to fail.

name: Generate social images

on:
  schedule:
    # 03:17 UTC Monday - Weekly Roundup.
    # 03:17 UTC Friday  - Weekend Roundup.
    #
    # CHANGED 13 October 2026: Thursday -> Friday, at the owner's request. The
    # Weekend post is now emailed on a Friday morning and goes out at 11am that
    # same day, rather than being built on Thursday and sitting over a day.
    #
    # These run early because this workflow builds social/queue.json, which is
    # what makes Apps Script send the approval email - so it has to finish in
    # time for the owner to read it before the 11:00 cutoff. Generating at 11:00
    # would leave no review window at all.
    - cron: '17 3 * * 1'
    - cron: '17 3 * * 5'
    # Fired by Apps Script when the owner changes their event choices on the
    # approval page. Rebuilds the post so the image matches the new list, then
    # the owner is emailed again to approve that one.
    #
    # The choices do NOT come through here. Apps Script holds a trigger-only
    # token and cannot push, so they travel via the published "Post Choices"
    # sheet, read below as POST_CHOICES_URL. That is what keeps the token from
    # being able to alter anything - see SOCIAL-POST-CHOICES.md.
    - repository_dispatch:
        types: [social-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # `npm ci` needs package-lock.json to exist. Until one is committed
        # this falls back to `npm install` and generates it, so the first run
        # succeeds. Once the lockfile is committed, `npm ci` takes over and
        # installs exactly the pinned versions.
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json yet - installing and generating one."
            npm install --no-audit --no-fund
          fi

      - name: Select events
        # workflow_dispatch can fire on any weekday. When run manually, both
        # variants are selected so a test run produces images to look at;
        # on the scheduled days selection picks the one that is due.
        #
        # A social-rebuild behaves like workflow_dispatch: the owner's change
        # names a specific post, and re-selecting both variants would rebuild a
        # post nobody asked to change.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            node select-social-events.js --all
          else
            node select-social-events.js
          fi

      - name: Apply the owner's event choices
        # Only meaningful on a rebuild. On the ordinary Monday and Friday runs
        # POST_CHOICES_URL is unset, the script says so and does nothing - which
        # is why this step is safe to run every time.
        env:
          POST_CHOICES_URL: ${{ vars.POST_CHOICES_URL }}
        run: |
          set -euo pipefail
          node apply-choices.js

      - name: Render images
        # Nothing due today (selection is Monday/Thursday only, and a manual
        # run can land on any weekday). Succeed quietly rather than failing on
        # a missing social-posts.json.
        run: |
          set -euo pipefail
          if [ ! -f social-posts.json ]; then
            echo "No social-posts.json - nothing due today. Nothing to render."
            exit 0
          fi
          node generate-social-images.js

      - name: Build captions and queue
        # Writes the review markdown to social/drafts/ (gitignored) and the
        # machine-readable hand-off to social/queue.json (committed).
        #
        # The queue file is what Apps Script reads from the deployed site to
        # build the Social tab row and send the approval email. Without this
        # step the images are generated but nothing ever reaches the owner for
        # approval, and nothing posts.
        run: |
          set -euo pipefail
          if [ ! -f social-posts.json ]; then
            echo "No social-posts.json - nothing due today. No queue entry."
            exit 0
          fi
          node build-captions.js

      - name: Record rotation history
        # Marks the events just rendered as used, so the next run rotates away
        # from them. Committed alongside the images, because the history has to
        # survive between runner sessions - a fresh checkout each run would
        # otherwise always pick the same events.
        # Deliberately reads back social-posts.json rather than re-selecting,
        # which would rotate to different events and leave image and history
        # disagreeing.
        run: |
          set -euo pipefail
          if [ ! -f social-posts.json ]; then
            echo "Nothing rendered, so nothing to record."
            exit 0
          fi
          node select-social-events.js --record-only

      - name: Commit archive
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain -- social)" ]; then
            echo "No new images - nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social
          git commit -m "Add social images"

          if ! git push; then
            echo ""
            echo "::error::The commit was rejected when pushing to the branch."
            echo ""
            echo "Check  Settings > Branches > Branch protection rules."
            echo "If 'main' is protected, either remove the rule, or allow"
            echo "GitHub Actions to bypass it, then re-run this workflow."
            exit 1
          fi

          echo "Pushed. GitHub Pages should rebuild in about a minute."
